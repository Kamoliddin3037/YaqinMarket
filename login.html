<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SellFlowUZ — Kirish</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  height:100%;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* Background */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 10%, rgba(0,229,255,.06) 0%, transparent 55%),
    radial-gradient(ellipse 50% 50% at 85% 85%, rgba(0,80,160,.05)  0%, transparent 55%);
  pointer-events:none;z-index:0;
}

/* Page wrap */
.wrap{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:28px 16px;
  position:relative;z-index:1;
}

/* Logo */
.logo-area{
  text-align:center;
  margin-bottom:32px;
  animation:fadeDown .55s ease both;
}
.logo-circle{
  width:76px;height:76px;
  background:linear-gradient(135deg,var(--cyan3),var(--cyan2));
  border-radius:20px;
  margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;
  box-shadow:var(--glow), 0 16px 36px rgba(0,0,0,.45);
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{box-shadow:var(--glow),0 16px 36px rgba(0,0,0,.45);}
  50%{box-shadow:0 0 36px rgba(0,229,255,.55),0 16px 36px rgba(0,0,0,.45);}
}
.logo-title{
  font-family:var(--font-mono);
  font-size:20px;font-weight:900;
  color:var(--text);letter-spacing:3px;
  margin-bottom:5px;
}
.logo-sub{
  font-size:12px;color:var(--muted);letter-spacing:1.5px;
  text-transform:uppercase;
}

/* Card */
.login-card{
  width:100%;max-width:420px;
  background:rgba(15,31,53,.9);
  border:1px solid var(--border2);
  border-radius:20px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 28px 56px rgba(0,0,0,.55), 0 0 0 1px rgba(0,229,255,.04);
  overflow:hidden;
  animation:fadeUp .6s ease .1s both;
}

/* Role tabs */
.role-tabs{
  display:flex;
  border-bottom:1px solid var(--border);
  background:rgba(10,22,40,.5);
}
.role-tab{
  flex:1;padding:14px 8px 13px;
  text-align:center;cursor:pointer;
  font-size:12px;font-weight:700;
  color:var(--muted);
  transition:all .2s;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  border:none;background:none;
  font-family:var(--font-body);
  letter-spacing:.5px;
  user-select:none;
}
.role-tab .tab-ico{font-size:19px;transition:filter .2s;}
.role-tab::after{
  content:'';position:absolute;bottom:0;left:16%;right:16%;
  height:2px;border-radius:2px 2px 0 0;
  background:var(--cyan);
  transform:scaleX(0);transition:transform .25s cubic-bezier(.34,1.3,.64,1);
}
.role-tab:hover{color:var(--text2);}
.role-tab.active{color:var(--text);}
.role-tab.active::after{transform:scaleX(1);}
.role-tab.active .tab-ico{filter:drop-shadow(0 0 5px var(--cyan));}

/* Forms wrap */
.forms-wrap{padding:26px 24px 30px;}

.form-section{display:none;}
.form-section.active{display:block;animation:formIn .28s ease;}
@keyframes formIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.form-title{
  font-family:var(--font-mono);
  font-size:11px;color:var(--cyan);
  letter-spacing:2px;font-weight:700;
  margin-bottom:22px;
  display:flex;align-items:center;gap:8px;
}
.form-title::before{
  content:'';display:inline-block;
  width:3px;height:14px;
  background:var(--cyan);border-radius:2px;
}

/* Input group */
.inp-group{margin-bottom:16px;}
.inp-label{
  display:block;font-size:10px;font-weight:700;
  color:var(--muted);letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:7px;
}
.inp-wrap{position:relative;}
.inp-ico{
  position:absolute;left:13px;top:50%;
  transform:translateY(-50%);
  font-size:16px;pointer-events:none;
}
.inp-field{
  width:100%;padding:12px 14px 12px 42px;
  background:rgba(10,22,40,.7);
  border:1px solid var(--border2);
  border-radius:10px;
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;font-weight:600;
  outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.inp-field:focus{
  border-color:var(--cyan2);
  background:rgba(0,229,255,.04);
  box-shadow:0 0 0 3px rgba(0,229,255,.09);
}
.inp-field::placeholder{color:var(--muted2);}
.inp-field.err{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(255,45,85,.1);
}

/* Password eye */
.eye-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  font-size:17px;color:var(--muted);
  transition:color .18s;padding:4px;
}
.eye-btn:hover{color:var(--cyan);}
.inp-field.has-eye{padding-right:44px;}

/* Phone flag */
.phone-flag{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:4px;font-size:15px;pointer-events:none;
}
.phone-code{
  font-size:12px;font-weight:700;color:var(--muted);
  font-family:var(--font-body);
}

/* Remember */
.remember-row{
  display:flex;align-items:center;gap:9px;
  margin-bottom:20px;cursor:pointer;
  font-size:13px;color:var(--muted);font-weight:600;
  user-select:none;
}
.remember-row input[type=checkbox]{
  width:16px;height:16px;border-radius:4px;
  accent-color:var(--cyan);cursor:pointer;flex-shrink:0;
}

/* Login button */
.login-btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--cyan3),var(--cyan2));
  color:var(--bg);border:none;border-radius:10px;
  font-family:var(--font-mono);font-size:11px;
  font-weight:700;letter-spacing:3px;cursor:pointer;
  transition:all .22s;
  box-shadow:0 6px 20px rgba(0,229,255,.25);
}
.login-btn:hover{
  background:linear-gradient(135deg,var(--cyan2),var(--cyan));
  box-shadow:var(--glow);transform:translateY(-1px);
}
.login-btn:active{transform:translateY(0) scale(.98);}

/* Info note */
.info-note{
  background:rgba(0,229,255,.05);
  border:1px solid rgba(0,229,255,.12);
  border-radius:8px;padding:11px 14px;
  font-size:12px;color:var(--muted);
  margin-top:16px;line-height:1.65;
  display:flex;gap:10px;align-items:flex-start;
}
.info-note .ni{font-size:16px;flex-shrink:0;margin-top:1px;}

/* Security badge */
.security-badge{
  display:flex;align-items:center;gap:8px;
  justify-content:center;margin-top:18px;
  font-size:11px;color:var(--muted2);letter-spacing:.5px;
}

/* Toast override */
.toast{
  position:fixed;top:20px;left:50%;
  transform:translateX(-50%) translateY(-70px);
  background:var(--panel2);
  border:1px solid var(--border2);
  color:var(--text);padding:11px 22px;
  border-radius:40px;font-size:13px;font-weight:700;
  z-index:9999;transition:transform .3s cubic-bezier(.34,1.4,.64,1);
  white-space:nowrap;box-shadow:var(--shadow);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{border-color:rgba(57,255,20,.5);color:var(--green);}
.toast.error  {border-color:rgba(255,45,85,.5); color:var(--red);}
.toast.warning{border-color:rgba(255,183,3,.5); color:var(--amber);}
</style>
</head>
<body>
<div class="sfu-bg"></div>
<div class="sfu-grid"></div>

<div class="toast" id="toast"></div>

<div class="wrap">

  <!-- LOGO -->
  <div class="logo-area">
    <div class="logo-circle">🏪</div>
    <div class="logo-title">SELLFLOWUZ</div>
    <div class="logo-sub">Savdo boshqaruv tizimi</div>
  </div>

  <!-- CARD -->
  <div class="login-card">

    <!-- ROLE TABS -->
    <div class="role-tabs">
      <button class="role-tab active" id="tabCustomer" onclick="switchRole('customer')">
        <span class="tab-ico">🛍️</span>Xaridor
      </button>
      <button class="role-tab" id="tabSeller" onclick="switchRole('seller')">
        <span class="tab-ico">🧑‍💼</span>Sotuvchi
      </button>
      <button class="role-tab" id="tabAdmin" onclick="switchRole('admin')">
        <span class="tab-ico">⚙️</span>Admin
      </button>
    </div>

    <div class="forms-wrap">

      <!-- XARIDOR -->
      <div class="form-section active" id="customerForm">
        <div class="form-title">XARIDOR KIRISHI</div>

        <div class="inp-group">
          <label class="inp-label">Ism Familiya</label>
          <div class="inp-wrap">
            <span class="inp-ico">👤</span>
            <input class="inp-field" id="custName" type="text"
              placeholder="Ismingizni kiriting" autocomplete="name">
          </div>
        </div>

        <div class="inp-group">
          <label class="inp-label">Telefon raqam</label>
          <div class="inp-wrap">
            <div class="phone-flag">🇺🇿<span class="phone-code">+998</span></div>
            <input class="inp-field" id="custPhone" type="tel"
              placeholder="90 123 45 67" autocomplete="tel"
              style="padding-left:74px;"
              oninput="formatPhone(this)">
          </div>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="rememberCustomer" checked>
          Qurilmada eslab qolsin
        </label>

        <button class="login-btn" onclick="customerLogin()">KIRISH</button>

        <div class="info-note">
          <span class="ni">ℹ️</span>
          <span>Birinchi marta kirganingizda avtomatik ro'yxatdan o'tiladi. Keyingi safar telefon raqami bilan tezkor kirish.</span>
        </div>
      </div>

      <!-- SOTUVCHI -->
      <div class="form-section" id="sellerForm">
        <div class="form-title">SOTUVCHI KIRISHI</div>

        <div class="inp-group">
          <label class="inp-label">Login</label>
          <div class="inp-wrap">
            <span class="inp-ico">👤</span>
            <input class="inp-field" id="sellerLogin" type="text"
              placeholder="seller" autocomplete="username">
          </div>
        </div>

        <div class="inp-group">
          <label class="inp-label">Parol</label>
          <div class="inp-wrap">
            <span class="inp-ico">🔒</span>
            <input class="inp-field has-eye" id="sellerPass" type="password"
              placeholder="••••••••" autocomplete="current-password">
            <button class="eye-btn" onclick="togglePass('sellerPass',this)">👁️</button>
          </div>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="rememberSeller" checked>
          Qurilmada eslab qolsin
        </label>

        <button class="login-btn" onclick="sellerLogin()">KIRISH</button>
      </div>

      <!-- ADMIN -->
      <div class="form-section" id="adminForm">
        <div class="form-title">ADMIN KIRISHI</div>

        <div class="inp-group">
          <label class="inp-label">Login</label>
          <div class="inp-wrap">
            <span class="inp-ico">🔑</span>
            <input class="inp-field" id="adminLogin" type="text"
              placeholder="admin" autocomplete="username">
          </div>
        </div>

        <div class="inp-group">
          <label class="inp-label">Parol</label>
          <div class="inp-wrap">
            <span class="inp-ico">🔐</span>
            <input class="inp-field has-eye" id="adminPass" type="password"
              placeholder="••••••••" autocomplete="current-password">
            <button class="eye-btn" onclick="togglePass('adminPass',this)">👁️</button>
          </div>
        </div>

        <button class="login-btn" onclick="adminLogin()">KIRISH</button>
      </div>

    </div>
  </div>

  <div class="security-badge">🔒 &nbsp; Ma'lumotlar xavfsiz saqlanadi</div>
</div>

<script src="data.js"></script>
<script>
function getDeviceId(){
  var d=localStorage.getItem('sfu_device_id');
  if(!d){d='DEV_'+Date.now()+'_'+Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem('sfu_device_id',d);}
  return d;
}
function getDeviceInfo(){
  var ua=navigator.userAgent,dev='Noma\'lum';
  if(/iPhone/.test(ua))dev='iPhone';
  else if(/iPad/.test(ua))dev='iPad';
  else if(/Android/.test(ua))dev='Android';
  else if(/Windows/.test(ua))dev='Windows PC';
  else if(/Mac/.test(ua))dev='Mac';
  return{deviceId:getDeviceId(),device:dev,ua:ua.slice(0,80)};
}

function formatPhone(inp){
  var v=inp.value.replace(/\D/g,'');
  if(v.startsWith('998'))v=v.slice(3);
  if(v.length>9)v=v.slice(0,9);
  var f='';
  if(v.length>0)f=v.slice(0,2);
  if(v.length>2)f+=' '+v.slice(2,5);
  if(v.length>5)f+=' '+v.slice(5,7);
  if(v.length>7)f+=' '+v.slice(7,9);
  inp.value=f;
}

function getFullPhone(val){
  var d=val.replace(/\D/g,'');
  if(d.length===9)return'+998'+d;
  if(d.length===12&&d.startsWith('998'))return'+'+d;
  return'+998'+d;
}

var activeRole='customer';
function switchRole(r){
  activeRole=r;
  ['customer','seller','admin'].forEach(function(x){
    document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===r);
    document.getElementById(x+'Form').classList.toggle('active',x===r);
  });
}

function togglePass(id,btn){
  var inp=document.getElementById(id);
  var isPass=inp.type==='password';
  inp.type=isPass?'text':'password';
  btn.textContent=isPass?'🙈':'👁️';
}

function customerLogin(){
  var name=document.getElementById('custName').value.trim();
  var phoneRaw=document.getElementById('custPhone').value.trim();
  var phone=getFullPhone(phoneRaw);
  if(!name){document.getElementById('custName').classList.add('err');showToast('Ismingizni kiriting!','error');return;}
  document.getElementById('custName').classList.remove('err');
  if(phoneRaw.replace(/\D/g,'').length<9){document.getElementById('custPhone').classList.add('err');showToast('Telefon raqam kiriting!','error');return;}
  document.getElementById('custPhone').classList.remove('err');
  var dInfo=getDeviceInfo();
  var users=DB.getUsers();
  var user=users.find(function(u){return u.phone===phone;});
  if(user){
    // Ism mos keladimi?
    var inputNorm=name.toLowerCase().replace(/\s+/g,' ').trim();
    var existNorm=(user.name||'').toLowerCase().replace(/\s+/g,' ').trim();
    if(inputNorm!==existNorm){
      document.getElementById('custPhone').classList.add('err');
      showToast('❌ Bu telefon raqam allaqachon ro\'yxatdan o\'tgan!','error');
      return;
    }
    // Ism + nomer mos — avtorizatsiya
    user.deviceId=dInfo.deviceId;user.device=dInfo.device;
  } else {
    user={id:Date.now(),name:name,phone:phone,registeredAt:new Date().toISOString(),
      deviceId:dInfo.deviceId,device:dInfo.device,purchases:0,totalSpent:0,debt:0,debtHistory:[]};
    users.push(user);
  }
  DB.saveUsers(users);
  DB.setSession({role:'customer',userId:user.id,name:name,phone:phone,device:dInfo});
  if(document.getElementById('rememberCustomer').checked){
    localStorage.setItem('sfu_remembered_customer',JSON.stringify({userId:user.id,name:name,phone:phone,device:dInfo,savedAt:new Date().toISOString()}));
  }
  showToast('Xush kelibsiz, '+name+'!','success');
  setTimeout(function(){window.location.href='/shop';},700);
}

async function sellerLogin(){
  var login=document.getElementById('sellerLogin').value.trim().toLowerCase();
  var pass=document.getElementById('sellerPass').value;
  if(!login||!pass){showToast('Login va parolni kiriting!','error');return;}
  try{
    var res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'seller',login:login,password:pass})});
    var data=await res.json();
    if(!data.ok){
      document.getElementById('sellerLogin').classList.add('err');
      document.getElementById('sellerPass').classList.add('err');
      showToast(data.error||'Login yoki parol xato!','error');return;
    }
    localStorage.setItem('sfu_v1_token',data.token);
    var sd={role:'seller',name:data.name,employeeId:data.employeeId,permissions:data.permissions||['pos']};
    localStorage.setItem('sfu_v1_session',JSON.stringify(sd));
    DB._cache['session']=sd;
    if(document.getElementById('rememberSeller').checked)localStorage.setItem('sfu_remembered_seller',JSON.stringify({login:login}));
    localStorage.setItem('sfu_fs_locked','1');
    showToast('Xush kelibsiz, '+data.name+'!','success');
    document.documentElement.requestFullscreen().catch(function(){});
    setTimeout(function(){window.location.href='/pos';},500);
  }catch(e){showToast('Server bilan bog\'lanib bo\'lmadi!','error');}
}

async function adminLogin(){
  var login=document.getElementById('adminLogin').value.trim();
  var pass=document.getElementById('adminPass').value;
  if(!login||!pass){showToast('Login va parolni kiriting!','error');return;}
  try{
    var res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'admin',login:login,password:pass})});
    var data=await res.json();
    if(!data.ok){
      document.getElementById('adminLogin').classList.add('err');
      document.getElementById('adminPass').classList.add('err');
      showToast(data.error||'Login yoki parol xato!','error');return;
    }
    localStorage.setItem('sfu_v1_token',data.token);
    var sd={role:'admin',name:'Admin'};
    localStorage.setItem('sfu_v1_session',JSON.stringify(sd));
    localStorage.setItem('sfu_fs_locked','1');
    DB._cache['session']=sd;
    showToast('Admin panelga xush kelibsiz!','success');
    document.documentElement.requestFullscreen().catch(function(){});
    setTimeout(function(){window.location.href='/host';},400);
  }catch(e){showToast('Server bilan bog\'lanib bo\'lmadi!','error');}
}

function _enterFS(){
  localStorage.setItem('sfu_fs_locked','1');
  document.documentElement.requestFullscreen().then(function(){
    if(navigator.keyboard&&navigator.keyboard.lock)navigator.keyboard.lock(['F11']).catch(function(){});
  }).catch(function(){});
}
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&navigator.keyboard&&navigator.keyboard.unlock)navigator.keyboard.unlock();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    if(activeRole==='customer')customerLogin();
    else if(activeRole==='seller')sellerLogin();
    else adminLogin();
  }
  if(e.key==='F11'){e.preventDefault();if(!document.fullscreenElement)_enterFS();}
  if(e.key==='Escape'){localStorage.removeItem('sfu_fs_locked');if(navigator.keyboard&&navigator.keyboard.unlock)navigator.keyboard.unlock();}
});

function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+(type||'');
  setTimeout(function(){t.className='toast';},2800);
}

(function(){
  var fs=localStorage.getItem('sfu_fs_locked')==='1';
  var s=DB.getSession();
  if(fs&&s&&s.role==='admin'){window.location.href='/dashboard';return;}
  if(fs&&s&&s.role==='seller'){window.location.href='/pos';return;}
  if(!fs)DB.clearSession();
})();
</script>
</body>
</html>
