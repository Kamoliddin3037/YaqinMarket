<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyurtmalar — SellFlowUZ</title>
</link>
<link rel="stylesheet" href="style.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --panelS:var(--panel);
  --sidebar:var(--sidebar-w);
}
html,body{height:100%;overflow-x:hidden}
body{background:linear-gradient(135deg,#0d1b2a,#152538);font-family:var(--font-body);color:var(--text);display:flex;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(0,229,255,.05) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0;}

/* SIDEBAR */
.sidebar{width:var(--sidebar);min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform .3s;}
.sidebar-logo{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--cyan),var(--cyan2));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--glow-sm);}
.logo-text{font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:1.5px;line-height:1.3;}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-section{padding:10px 16px 4px;font-size:10px;color:var(--muted2);font-weight:700;letter-spacing:3px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--muted);cursor:pointer;transition:all .2s;border-left:2px solid transparent;font-size:14px;font-weight:600;}
.nav-item:hover{color:var(--text);background:rgba(0,229,255,.04);}
.nav-item.active{color:var(--cyan);background:rgba(0,229,255,.07);border-left-color:var(--cyan);}
.nav-item .badge{margin-left:auto;background:var(--red);color:var(--text);font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.nav-icon{font-size:17px;width:22px;text-align:center;}
.sidebar-bottom{padding:14px;border-top:1px solid var(--border);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:10px;}
.user-avatar{width:34px;height:34px;background:linear-gradient(135deg,var(--cyan3),var(--cyan2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
.user-info-name{font-size:13px;font-weight:700;color:var(--text);}
.user-info-role{font-size:10px;color:var(--cyan);font-family:var(--font-mono);letter-spacing:1px;}
.logout-btn{width:100%;padding:9px;background:rgba(255,45,85,.1);border:1px solid rgba(255,45,85,.3);color:var(--red);border-radius:4px;font-family:var(--font-body);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.logout-btn:hover{background:rgba(255,45,85,.2);}

/* MAIN */
.main{margin-left:var(--sidebar);flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:rgba(10,22,40,.95);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
:fullscreen .topbar,:-webkit-full-screen .topbar{top:14px;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;}
.page-title{font-family:var(--font-mono);font-size:13px;color:var(--text);letter-spacing:2px;}
.page-breadcrumb{font-size:12px;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:10px;flex:1;justify-content:center;}

/* TICKER in topbar */
.ticker-wrap{flex:1;max-width:480px;overflow:hidden;position:relative;}
.ticker-inner{display:flex;gap:64px;animation:ticker 22s linear infinite;white-space:nowrap;}
.ticker-item{font-size:12px;color:var(--amber);font-weight:600;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;}
.ticker-item .disc-badge{background:rgba(255,45,85,.2);border:1px solid rgba(255,45,85,.4);color:var(--red);font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

.topbar-time{font-family:var(--font-mono);font-size:13px;color:var(--cyan);letter-spacing:2px;}
.icon-action{width:36px;height:36px;background:var(--panelS);border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;transition:all .2s;}
.icon-action:hover{border-color:var(--cyan);}

/* FULLSCREEN BTN */
.fs-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:5px;font-family:var(--font-mono);letter-spacing:1px;}
.fs-btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,.2);}

.content{padding:20px 24px;flex:1;position:relative;z-index:1;}

/* STAT CARDS */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px;position:relative;overflow:hidden;transition:all .25s;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat-card.c1::before{background:linear-gradient(90deg,var(--cyan),var(--cyan2));}
.stat-card.c2::before{background:linear-gradient(90deg,var(--amber),#ff8c00);}
.stat-card.c3::before{background:linear-gradient(90deg,var(--green),#00cc00);}
.stat-card.c4::before{background:linear-gradient(90deg,var(--purple),#7b2fff);}
.stat-card.c5::before{background:linear-gradient(90deg,var(--red),#cc0033);}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px);}
.stat-label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.stat-value{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--text);margin-bottom:2px;}
.stat-sub{font-size:11px;color:var(--muted);}
.stat-sub-dual{font-size:10px;color:var(--muted);margin-top:2px;}

/* SECTIONS */
.section{display:none;}
.section.active{display:block;animation:fadeSlide .3s ease;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* PANEL CARD */
.panel-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.panel-head-title{font-family:var(--font-mono);font-size:12px;color:var(--cyan);letter-spacing:2px;}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:4px;font-family:var(--font-body);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;border:none;display:inline-flex;align-items:center;gap:6px;}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:var(--bg);}
.btn-cyan:hover{box-shadow:var(--glow);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);}
.btn-danger{background:rgba(255,45,85,.15);border:1px solid rgba(255,45,85,.3);color:var(--red);}
.btn-amber{background:rgba(255,183,3,.15);border:1px solid rgba(255,183,3,.3);color:var(--amber);}
.btn-green{background:rgba(57,255,20,.1);border:1px solid rgba(57,255,20,.3);color:var(--green);}
.btn-sm{padding:5px 11px;font-size:12px;}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;}
.data-table th{padding:11px 13px;background:rgba(0,0,0,.2);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;text-align:left;border-bottom:1px solid var(--border);}
.data-table td{padding:11px 13px;border-bottom:1px solid rgba(42,74,106,.4);font-size:13px;}
.data-table tr:hover td{background:rgba(0,229,255,.025);}
.stock-edit{width:70px;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-body);font-size:13px;text-align:center;}
.stock-edit:focus{border-color:var(--cyan);outline:none;}

/* ORDERS */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:18px;}
.order-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px;transition:all .25s;position:relative;overflow:hidden;}
.order-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;}
.order-card.status-new::before{background:var(--cyan2);}
.order-card.status-accepted::before{background:var(--amber);}
.order-card.status-delivering::before{background:var(--green);}
.order-card.status-done::before{background:var(--muted);}
.order-card.status-cancelled::before{background:var(--red);}
.order-card:hover{border-color:var(--border2);transform:translateY(-2px);}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.order-id{font-family:var(--font-mono);font-size:13px;color:var(--text);}
.status-badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;}
.sb-new{background:rgba(0,180,216,.15);color:var(--cyan2);}
.sb-accepted{background:rgba(255,183,3,.15);color:var(--amber);}
.sb-delivering{background:rgba(57,255,20,.1);color:var(--green);}
.sb-done{background:rgba(74,122,153,.15);color:var(--muted);}
.sb-cancelled{background:rgba(255,45,85,.1);color:var(--red);}
.type-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:8px;letter-spacing:1px;}
.tb-online{background:rgba(0,180,216,.1);color:var(--cyan2);}
.tb-offline{background:rgba(255,183,3,.1);color:var(--amber);}
.order-customer{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:4px;padding:9px 12px;margin:8px 0;}
.oc-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;}
.oc-detail{font-size:11px;color:var(--muted);}
.order-items-list{margin:6px 0;max-height:90px;overflow-y:auto;}
.order-item-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);font-size:12px;}
.order-item-row:last-child{border-bottom:none;}
.order-item-name{color:var(--text);}
.order-item-price{color:var(--cyan);font-weight:600;}
.order-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.order-total-label{font-size:15px;font-weight:700;color:var(--text);}
.order-profit{font-size:11px;color:var(--green);}
.order-actions{display:flex;gap:6px;flex-wrap:wrap;}

/* CALENDAR */
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
.cal-header-day{text-align:center;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:2px;padding:5px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-day{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:8px 6px;text-align:center;cursor:pointer;transition:all .2s;min-height:64px;display:flex;flex-direction:column;align-items:center;}
.cal-day:hover{border-color:var(--cyan2);}
.cal-day.today{border-color:var(--cyan);background:rgba(0,229,255,.06);}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-num{font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px;}
.cal-day.today .cal-num{color:var(--cyan);}
.cal-day-stat{font-size:10px;color:var(--muted);line-height:1.4;}
.cal-day.has-data .cal-day-stat{color:var(--amber);}

/* OFFLINE SALE */
.off-search{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;margin-bottom:12px;}
.off-search:focus{border-color:var(--cyan);}
.offline-product{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px;}
.off-prod-info{flex:1;}
.off-prod-name{font-size:13px;font-weight:600;color:var(--text);}
.off-prod-price{font-size:12px;color:var(--cyan);}
.off-prod-stock{font-size:10px;color:var(--muted);}
.qty-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.qbtn{width:44px;height:44px;border-radius:8px;border:none;font-size:22px;font-weight:700;cursor:pointer;transition:all .2s;}
.qbtn.minus{background:rgba(255,45,85,.15);color:var(--red);}
.qbtn.plus{background:rgba(0,229,255,.1);color:var(--cyan);}
.qbtn:hover{transform:scale(1.1);}
.qty-num{font-size:15px;font-weight:700;color:var(--text);min-width:18px;text-align:center;}

/* BARCODE */
.barcode-row{display:flex;gap:8px;}
.barcode-row input{flex:1;}
.gen-barcode-btn{padding:10px 14px;background:rgba(0,229,255,.08);border:1px solid var(--border);border-radius:4px;color:var(--cyan);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.gen-barcode-btn:hover{border-color:var(--cyan);}

/* IMAGE UPLOAD */
.img-upload-area{border:2px dashed var(--border);border-radius:6px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:4px;}
.img-upload-area:hover{border-color:var(--cyan2);}
.img-upload-area img{max-height:100px;border-radius:4px;margin-bottom:8px;}
.img-upload-area .img-hint{font-size:12px;color:var(--muted);}

/* WAREHOUSE */
.warehouse-bar{display:flex;align-items:center;gap:8px;}
.wb-label{font-size:11px;color:var(--muted);white-space:nowrap;}
.wb-track{flex:1;height:8px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.wb-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.wb-val{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;min-width:36px;text-align:right;}
.wh-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;transition:all .2s;}
.wh-card:hover{border-color:var(--border2);background:rgba(26,45,66,.8);}
.wh-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.wh-card-name{font-size:14px;font-weight:700;color:var(--text);}
.wh-card-cat{font-size:10px;color:var(--muted);margin-top:2px;}
.wh-card-stock{text-align:right;}
.wh-card-qty{font-family:var(--font-mono);font-size:16px;font-weight:700;}
.wh-card-unit{font-size:11px;color:var(--muted);}
.wh-card-stats{display:flex;gap:16px;margin-bottom:8px;}
.wh-stat{font-size:11px;color:var(--muted);}
.wh-stat span{font-weight:700;}

/* 52MM RECEIPT */
.receipt-52{font-family:'Courier New',monospace;font-size:12px;background:white;color:#000;padding:12px;width:200px;margin:0 auto;border-radius:4px;}
.receipt-52 .r-title{text-align:center;font-weight:700;font-size:14px;margin-bottom:6px;}
.receipt-52 .r-line{display:flex;justify-content:space-between;padding:2px 0;font-size:11px;}
.receipt-52 .r-line.bold{font-weight:700;border-top:1px dashed #999;padding-top:5px;margin-top:3px;}
.receipt-52 hr{border:none;border-top:1px dashed #999;margin:5px 0;}
.receipt-52 .r-footer{text-align:center;color:#666;font-size:10px;margin-top:6px;}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal.open{display:flex;animation:fadeIn .2s ease;}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:6px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 0 50px rgba(0,229,255,.1);animation:modalIn .25s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-box.wide{max-width:800px;}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg2);z-index:1;}
.modal-title{font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:2px;}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;transition:color .2s;}
.modal-close:hover{color:var(--red);}
.modal-body{padding:18px;}

/* FULLSCREEN OFFLINE */
.offline-fullscreen{position:fixed;inset:0;background:var(--bg);z-index:400;display:none;flex-direction:column;}
.offline-fullscreen.open{display:flex;}
.ofs-head{background:rgba(10,22,40,.95);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.ofs-title{font-family:var(--font-mono);font-size:14px;color:var(--cyan);letter-spacing:2px;}
.ofs-body{display:grid;grid-template-columns:1fr 340px;flex:1;overflow:hidden;}
.ofs-left{overflow-y:auto;padding:16px;}
.ofs-right{background:#152030;border-left:1px solid var(--border);display:flex;flex-direction:column;padding:0;overflow:hidden;}
.ofs-cart-title{font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:2px;padding:12px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ofs-cart-list{flex:1;overflow-y:auto;padding:12px 16px;}
.ofs-cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.ofs-cart-name{color:var(--text);flex:1;}
.ofs-cart-qty{color:var(--cyan);margin:0 10px;font-weight:700;}
.ofs-cart-price{color:var(--amber);font-weight:700;font-size:12px;}
.ofs-cart-rm{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:0 4px;}
.ofs-total{border-top:2px solid var(--border);padding:14px 16px;background:#0f1e2e;flex-shrink:0;}
.ofs-total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px;}
.ofs-total-amount{font-family:var(--font-mono);color:var(--cyan);}
.ofs-prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.ofs-prod-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px;cursor:pointer;transition:all .2s;position:relative;}
.ofs-prod-card:hover{border-color:var(--cyan2);transform:translateY(-2px);}
.ofs-prod-card.in-cart{border-color:var(--cyan3);}
.ofs-prod-emoji{font-size:28px;display:block;text-align:center;margin-bottom:8px;}
.ofs-prod-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3;}
.ofs-prod-price{font-size:13px;color:var(--cyan);font-weight:700;}
.ofs-prod-stock{font-size:10px;color:var(--muted);margin-top:2px;}
.ofs-cart-badge{position:absolute;top:6px;right:6px;background:var(--cyan);color:var(--bg);width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.scan-input{width:100%;padding:10px 14px;background:rgba(0,229,255,.06);border:1px solid var(--cyan2);border-radius:4px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;margin-bottom:12px;}
.scan-input:focus{border-color:var(--cyan);box-shadow:var(--glow-sm);}
.scan-input::placeholder{color:var(--muted);}

/* FORM */
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:7px;}
.form-input,.form-select,.form-textarea{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-body);font-size:14px;font-weight:500;transition:all .2s;outline:none;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--cyan);box-shadow:var(--glow-sm);}
.form-input::placeholder{color:var(--muted);}
.form-select option{background:var(--bg2);}
.form-textarea{resize:vertical;min-height:70px;}
.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:var(--bg);border:none;border-radius:4px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:all .25s;margin-top:4px;}
.submit-btn:hover{box-shadow:var(--glow);transform:translateY(-1px);}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--border);margin-top:12px;font-size:16px;font-weight:700;color:var(--text);}
.total-amount{font-family:var(--font-mono);color:var(--cyan);font-size:15px;}

/* FILTER TABS */
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;}
.ftab{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.ftab:hover{border-color:var(--cyan2);color:var(--text);}
.ftab.active{background:rgba(0,229,255,.08);border-color:var(--cyan);color:var(--cyan);}

/* USERS */
.user-stats-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px 18px;margin-bottom:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;}
.us-val{font-family:var(--font-mono);font-size:18px;color:var(--cyan);}
.us-label{font-size:11px;color:var(--muted);margin-top:3px;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:6px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;max-width:300px;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:var(--red);}
.toast.info{border-color:var(--cyan);color:var(--cyan);}

/* SCROLLBAR */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4);background:#ff6b6b;}}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--cyan3);}

/* MOBILE */
@media(max-width:900px){.stats-row{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .stats-row{grid-template-columns:1fr 1fr;}
  .content{padding:14px;}
  .orders-grid{grid-template-columns:1fr;padding:14px;}
  .topbar{padding:0 14px;}
  .ticker-wrap{display:none;}
  .cal-day{min-height:48px;padding:5px 3px;}
  .cal-num{font-size:13px;}
  .ofs-body{grid-template-columns:1fr;}
  .ofs-right{display:none;}
  .fs-btn{display:flex;}
}
@media(max-width:480px){.stats-row{grid-template-columns:1fr 1fr;}.stat-value{font-size:15px;}}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
.sidebar-overlay.open{display:block;}

/* PROFIT CALC */
.profit-box{background:rgba(57,255,20,.06);border:1px solid rgba(57,255,20,.2);border-radius:4px;padding:8px 12px;margin-top:8px;font-size:13px;color:var(--green);}
</style>
</head>
<body>
<div class="sfu-bg"></div>
<div class="sfu-grid"></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="toast" id="toast"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">🏪</div><div class="logo-text">SellFlowUZ</div></div>
  <nav class="sidebar-nav">
    <div class="nav-item" onclick="window.location.href='/dashboard'"><span class="nav-icon">📅</span>Asosiy</div>
    <div class="nav-item active" onclick="window.location.href='/buyurtmalar'"><span class="nav-icon">📋</span>Buyurtmalar<span class="badge" id="newOrdersBadge" style="display:none">0</span></div>
    <div class="nav-item" onclick="window.location.href='/mahsulotlar'"><span class="nav-icon">📦</span>Mahsulotlar</div>
    <div class="nav-item" onclick="window.location.href='/ombor'"><span class="nav-icon">🏭</span>Ombor</div>
    <div class="nav-item" onclick="window.location.href='/daromad'"><span class="nav-icon">📈</span>Daromad</div>
    <div class="nav-item" onclick="window.location.href='/pos'"><span class="nav-icon">🏪</span>POS</div>
    <div class="nav-item" onclick="window.location.href='/mijozlar'"><span class="nav-icon">👥</span>Mijozlar</div>
    <div class="nav-item" onclick="window.location.href='/xodimlar'"><span class="nav-icon">👔</span>Xodimlar</div>
    <div class="nav-item" onclick="window.location.href='/bannerlar'"><span class="nav-icon">🖼️</span>Bannerlar</div>
    <div class="nav-item" onclick="window.location.href='/shop'"><span class="nav-icon">🛒</span>Do'kon</div>
    <div class="nav-item" onclick="window.location.href='/integratsiya'"><span class="nav-icon">🔗</span>Integratsiyalar</div>
  </nav>
  <div class="sidebar-bottom">
    <div class="sidebar-user"><div class="user-avatar">⚙️</div>
      <div><div class="user-info-name" id="sidebarUserName">Admin</div><div class="user-info-role" id="sidebarUserRole">SUPERUSER</div></div>
    </div>
    <button class="logout-btn" onclick="logout()">CHIQISH</button>
  </div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <div><div class="page-title">BUYURTMALAR</div><div class="page-breadcrumb">SellFlowUZ</div></div>
    </div>
    <div class="topbar-right"><div class="ticker-wrap"><div class="ticker-inner" id="tickerInner">⏳ Yuklanmoqda...</div></div></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="topbar-time" id="clock">--:--:--</div>
      <button class="fs-btn" onclick="tbFS()" id="fsBtn"><span>⛶</span> F11</button>
    </div>
  </header>
  <div class="content"><div id="secMain"></div></div>
</div>

<!-- RECEIPT MODAL -->
<div class="modal" id="modalReceipt">
  <div class="modal-box" style="max-width:280px;">
    <div class="modal-head"><div class="modal-title">CHek (52mm)</div><button class="modal-close" onclick="closeModal('modalReceipt')">✕</button></div>
    <div class="modal-body">
      <div id="receiptContent52"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-cyan" style="flex:1;" onclick="printReceipt()">🖨️ Print</button>
        <button class="btn btn-ghost" style="flex:1;" onclick="downloadReceipt()">📄 PDF</button>
      </div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script>
let products,orders,offlineSales,users,incomes,lastReceiptData=null;
const EMOJIS={'Non':'🍞','Sut':'🥛','Oziq':'🛒','Meva':'🍎','Sabzavot':'🥦','Ichimlik':'🥤','Bolalar':'👶','Boshqa':'📦'};
function fmt(n){return Number(n).toLocaleString('uz-UZ');}
function fmtShort(n){if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(0)+'K';return n.toString();}
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',3000);}
function logout(){
  window._logoutInProgress = true;
  DB.clearSession();
  localStorage.removeItem('sfu_fs_locked');
  var go = function(){ window._logoutInProgress=false; (window.top||window).location.href='/login'; };
  if(document.fullscreenElement){ document.exitFullscreen().then(go).catch(go); } else { go(); }
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');}
function startClock(){const u=()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('uz-UZ');u();setInterval(u,1000);}
function buildTicker(){
  const disc=products.filter(p=>{const d=calcDiscount(p);return d.discount>0&&p.stock>0;});
  if(!disc.length){document.getElementById('tickerInner').textContent='';return;}
  const h=disc.map(p=>{const d=calcDiscount(p);return`<span class="ticker-item">🔥 ${p.name} — <span class="disc-badge">-${d.discount}%</span> ${fmt(d.finalPrice)} so'm | ${d.daysLeft} kun qoldi</span>`;}).join('');
  document.getElementById('tickerInner').innerHTML=h+h;
}

function init(){
  const s=DB.getSession();
  if(!s||(s.role!=='admin'&&s.role!=='seller')){(window.top||window).location.href='/login';return;}
  if(s.role==='seller'){setTimeout(()=>{document.querySelectorAll('.nav-item').forEach(el=>{const t=el.textContent.trim();if(['Mahsulotlar','Ombor','Mijozlar'].some(x=>t.includes(x)))el.style.display='none';});},50);}
  products=DB.getProducts();orders=DB.getOrders();offlineSales=DB.getOffline();users=DB.getUsers();incomes=DB.getIncomes();
  _prevNewCount=orders.filter(o=>o.status==='new').length;
  const sn=document.getElementById('sidebarUserName');const sr=document.getElementById('sidebarUserRole');
  if(sn)sn.textContent=s.name||'Admin';
  if(sr)sr.textContent=s.role==='seller'?'SOTUVCHI':'ADMIN';
  startClock();buildTicker();
  render();
}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id);}));
let _currentFilter='all';
function renderOrders(filter='all'){
  _currentFilter=filter;
  let list=[...orders,...offlineSales].sort((a,b)=>new Date(b.time)-new Date(a.time));
  if(filter==='online')list=[...orders].sort((a,b)=>new Date(b.time)-new Date(a.time));
  if(filter==='offline')list=[...offlineSales].sort((a,b)=>new Date(b.time)-new Date(a.time));
  if(filter==='new')list=orders.filter(o=>o.status==='new');
  document.getElementById('secMain').innerHTML=`
    <div class="panel-card" style="margin-bottom:14px;">
      <div class="panel-head">
        <div class="filter-tabs">
          <button class="ftab ${filter==='all'?'active':''}" onclick="renderOrders('all')">Barchasi</button>
          <button class="ftab ${filter==='new'?'active':''}" onclick="renderOrders('new')">⚡ Yangi</button>
          <button class="ftab ${filter==='online'?'active':''}" onclick="renderOrders('online')">📱 Online</button>
          <button class="ftab ${filter==='offline'?'active':''}" onclick="renderOrders('offline')">🏪 Do'konda</button>
        </div>
      </div>
    </div>
    <div class="orders-grid">${list.length>0?list.map(renderOrderCard).join(''):'<div style="color:var(--muted);padding:20px;">Buyurtmalar yo\'q</div>'}</div>`;
}
function renderOrderCard(o){
  const sl={new:'YANGI',accepted:'QABUL',delivering:'YETKAZILMOQDA',done:'BAJARILDI',cancelled:'BEKOR'};
  const time=new Date(o.time).toLocaleString('uz-UZ');
  const actions=o.type==='online'?(function(){
    if(o.status==='new')return`<button class="btn btn-ghost btn-sm" onclick="updateStatus('${o.id}','accepted')">✔ Qabul</button><button class="btn btn-danger btn-sm" onclick="updateStatus('${o.id}','cancelled')">✕ Bekor</button>`;
    if(o.status==='accepted')return`<button class="btn btn-ghost btn-sm" onclick="updateStatus('${o.id}','delivering')">🚴 Yetkazish</button>`;
    if(o.status==='delivering')return`<button class="btn btn-green btn-sm" onclick="updateStatus('${o.id}','done')">✅ Bajarildi</button>`;
    return'';
  })():'';
  const receiptBadge=o.receiptImg
    ? `<div onclick="viewReceiptImg('${o.id}')" style="margin:6px 0;padding:6px 10px;background:rgba(0,150,80,.12);border:1px solid rgba(0,150,80,.35);border-radius:6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
        <span style="font-size:12px;font-weight:700;color:#1a6a40;">📎 To'lov cheki biriktrilgan</span>
        <span style="font-size:11px;background:#1a6a40;color:#fff;padding:2px 8px;border-radius:4px;">👁 Ko'rish</span>
      </div>`
    : '';
  const typeBadge=o.type==='online'?"📱 ONLINE":"🏪 DO'KON";
  const typeClass=o.type==='online'?'tb-online':'tb-offline';
  return `<div class="order-card status-${o.status||'done'}">
    <div class="order-top">
      <span class="order-id">${o.id}</span>
      <span class="status-badge sb-${o.status||'done'}">${sl[o.status||'done']||o.status}</span>
    </div>
    <span class="type-badge ${typeClass}">${typeBadge}</span>
    <div class="order-customer">
      <div class="oc-name">👤 ${o.userName||'Mijoz'}</div>
      <div class="oc-detail">📱 ${o.userPhone||'—'} &nbsp; ⏱ ${time}</div>
    </div>
    <div class="order-items-list">
      ${o.items.slice(0,4).map(i=>`<div class="order-item-row"><span class="order-item-name">${i.name} ×${i.qty}</span><span class="order-item-price">${fmt(i.price*i.qty)} so'm</span></div>`).join('')}
      ${o.items.length>4?`<div class="order-item-row"><span style="color:var(--muted);">...va yana ${o.items.length-4} ta</span></div>`:''}
    </div>
    ${receiptBadge}
    <div class="order-footer">
      <div>
        <div class="order-total-label">${fmt(o.total)} so'm</div>
        <div class="order-profit">+${fmt(o.profit||0)} so'm foyda</div>
      </div>
      <div class="order-actions">
        ${actions}
        <button class="btn btn-ghost btn-sm" onclick="openReceipt('${o.id}')">🧾 Chek</button>
      </div>
    </div>
  </div>`;
}

function openReceipt(id){
  var allOrders=(orders||[]).concat(offlineSales||[]);
  var o=allOrders.find(function(x){return x.id===id;});
  if(!o){showToast('Chek topilmadi','error');return;}
  showReceipt(o);
}

function showReceipt(o){
  lastReceiptData=o;
  const time=new Date(o.time).toLocaleString('uz-UZ');
  var rImg = o.receiptImg ? '<hr><div style="font-size:10px;font-weight:700;color:#555;margin-bottom:4px;">💳 TO\'LOV CHEKI:</div><img src="'+o.receiptImg+'" style="width:100%;border-radius:4px;border:1px solid #ddd;">' : '';
  document.getElementById('receiptContent52').innerHTML = `<div class="receipt-52" id="receiptPrintArea">
    <div class="r-title">🏪 SELLFLOWUZ</div>
    <div style="text-align:center;font-size:10px;margin-bottom:5px;">${time}</div>
    <div style="text-align:center;font-size:10px;margin-bottom:5px;">${o.id}</div>
    <hr>
    ${o.items.map(i=>`<div class="r-line"><span>${i.name}</span><span>${i.qty}×${fmt(i.price)}</span></div><div class="r-line" style="justify-content:flex-end;font-weight:700;">${fmt(i.price*i.qty)} so'm</div>`).join('')}
    <hr>
    <div class="r-line bold"><span>JAMI:</span><span>${fmt(o.total)} so'm</span></div>
    <div class="r-line"><span>To'lov:</span><span>${o.payment||'Naqd'}</span></div>
    ${o.userName ? `<hr><div class="r-footer">👤 ${o.userName}<br>Rahmat!</div>` : ''}
    ${rImg}
  </div>`;
  openModal('modalReceipt');
}
function printReceipt(){const c=document.getElementById('receiptPrintArea').outerHTML;const w=window.open('','_blank','width=300,height=600');w.document.write(`<html><head><style>body{margin:0;font-family:'Courier New',monospace;font-size:12px;}.receipt-52{width:200px;padding:10px;}.r-title{text-align:center;font-weight:700;font-size:14px;}.r-line{display:flex;justify-content:space-between;padding:1px 0;font-size:11px;}.r-line.bold{font-weight:700;border-top:1px dashed #999;}hr{border:none;border-top:1px dashed #999;margin:4px 0;}.r-footer{text-align:center;color:#666;font-size:10px;}</style></head><body>${c}<script>window.onload=()=>window.print();<\/script></body></html>`);w.document.close();}
function downloadReceipt(){if(!lastReceiptData)return;const o=lastReceiptData;const time=new Date(o.time).toLocaleString('uz-UZ');const w=window.open('','_blank','width=320,height=700');if(!w){showToast('❌ Popup bloklangan','error');return;}w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Chek</title><style>@media print{@page{size:52mm auto;margin:2mm;}}body{font-family:'Courier New',monospace;font-size:12px;width:190px;margin:0 auto;padding:8px;background:white;color:#000;}.title{text-align:center;font-weight:700;font-size:14px;}.sub{text-align:center;font-size:10px;color:#555;}.line{display:flex;justify-content:space-between;padding:2px 0;font-size:11px;}.bold{font-weight:700;border-top:1px dashed #000;padding-top:4px;}hr{border:none;border-top:1px dashed #000;margin:5px 0;}.footer{text-align:center;font-size:10px;color:#666;}.save-btn{display:block;width:100%;margin:8px 0;padding:9px;background:#00ffe7;color:#000;border:none;border-radius:4px;font-weight:700;font-size:12px;cursor:pointer;}@media print{.save-btn{display:none;}}</style></head><body><button class="save-btn" onclick="window.print()">🖨️ Print</button><div class="title">SELLFLOWUZ</div><div class="sub">${time}</div><div class="sub">${o.id}</div><hr>${o.items.map(i=>`<div class="line"><span>${i.name} x${i.qty}</span><span>${fmt(i.price*i.qty)}</span></div>`).join('')}<hr><div class="line bold"><span>JAMI:</span><span>${fmt(o.total)} so'm</span></div><div class="line"><span>To'lov:</span><span>${o.payment||'Naqd'}</span></div><hr><div class="footer">Rahmat!</div></body></html>`);w.document.close();}
let _prevNewCount = 0;
let _notifGranted = false;

function updateStatus(id, newStatus){
  var idx = orders.findIndex(function(o){return o.id===id;});
  if(idx===-1){showToast('Buyurtma topilmadi','error');return;}
  orders[idx].status = newStatus;
  DB.saveOrders(orders);
  var labels={accepted:'✔ Qabul qilindi',delivering:'🚴 Yetkazishga chiqarildi',done:'✅ Bajarildi',cancelled:'✕ Bekor qilindi'};
  showToast(labels[newStatus]||newStatus,'');
  if(newStatus==='accepted') playAcceptSound();
  else if(newStatus==='delivering') playDeliverySound();
  else if(newStatus==='done') playDoneSound();
  render();
}

function viewReceiptImg(id){
  var allOrders=(orders||[]).concat(offlineSales||[]);
  var o=allOrders.find(function(x){return x.id===id;});
  if(!o||!o.receiptImg){showToast('Chek rasmi topilmadi','error');return;}
  var w=window.open('','_blank','width=400,height=600');
  w.document.write('<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="'+o.receiptImg+'" style="max-width:100%;max-height:100vh;"></body></html>');
  w.document.close();
}

function requestNotifPerm(){
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission().then(p=>{ _notifGranted = p==='granted'; });
  } else if(Notification.permission === 'granted'){
    _notifGranted = true;
  }
}

var _audioCtx = null;
function _getAudio(){
  if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==='suspended') _audioCtx.resume();
  return _audioCtx;
}
function playBeep(freq, dur, vol){
  try{
    var ctx = _getAudio();
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq||880;
    gain.gain.setValueAtTime(vol||0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+(dur||0.3));
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+(dur||0.3));
  }catch(e){}
}


function autoRefresh(){
  const token = DB.getToken();
  if(!token) return;
  Promise.all([
    fetch('/api/orders',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).catch(()=>null),
    fetch('/api/offline',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json()).catch(()=>null)
  ]).then(function([resO, resF]){
    if(resO && resO.ok){
      orders = resO.data||[];
      DB._cache['orders'] = orders;
      try{localStorage.setItem('sfu_v1_orders',JSON.stringify(orders));}catch(e){}
    }
    if(resF && resF.ok){
      offlineSales = resF.data||[];
      DB._cache['offline'] = offlineSales;
      try{localStorage.setItem('sfu_v1_offline',JSON.stringify(offlineSales));}catch(e){}
    }
    const newCount = orders.filter(o=>o.status==='new').length;
    const b = document.getElementById('newOrdersBadge');
    if(b){ b.textContent=newCount; b.style.display=newCount>0?'inline':'none'; }
    if(newCount > _prevNewCount){
      const diff = newCount - _prevNewCount;
      playBeep();
      showToast('🔔 ' + diff + ' ta yangi buyurtma!', 'info');
      if(_notifGranted){
        new Notification('🏪 SellFlowUZ', {
          body: diff + ' ta yangi buyurtma keldi!',
          icon: '🏪'
        });
      }
      const badge = document.getElementById('newOrdersBadge');
      if(badge){ badge.style.animation='pulse 0.5s ease 3'; }
    }
    _prevNewCount = newCount;
    renderOrders(_currentFilter);
  });
}

function render(){
  const nc=orders.filter(o=>o.status==='new').length;
  const b=document.getElementById('newOrdersBadge');if(b){b.textContent=nc;b.style.display=nc>0?'inline':'none';}
  renderOrders();
}
init();
requestNotifPerm();
setInterval(autoRefresh, 10000); // har 10 sekunda

// ═══ UNIVERSAL FULLSCREEN ═══
function tbFS(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(function(){});
  } else {
    document.exitFullscreen();
  }
}
function posFS(){ tbFS(); }
function _fsUpdate(){
  var isFs=!!document.fullscreenElement;
  ['fsBtn','navF11','tbF11','navF11Btn'].forEach(function(id){
    var b=document.getElementById(id);
    if(!b)return;
    b.innerHTML=isFs?'&#x2715; ESC':'&#x26F6; F11';
    b.style.color=isFs?'#00ffe7':'';
    b.style.borderColor=isFs?'#00ffe7':'';
  });
}
function _enterFS(){
  localStorage.setItem('sfu_fs_locked','1');
  document.documentElement.requestFullscreen().then(function(){
    if(navigator.keyboard&&navigator.keyboard.lock)navigator.keyboard.lock(['F11']).catch(function(){});
  }).catch(function(){});
}
(function(){
  if(localStorage.getItem('sfu_fs_locked')==='1'){
    document.documentElement.requestFullscreen().then(function(){
      if(navigator.keyboard&&navigator.keyboard.lock)navigator.keyboard.lock(['F11']).catch(function(){});
    }).catch(function(){
      function _r(){_enterFS();document.removeEventListener('keydown',_r,true);document.removeEventListener('click',_r,true);}
      document.addEventListener('keydown',_r,{capture:true,once:true});
      document.addEventListener('click',_r,{capture:true,once:true});
    });
  }
})();
document.addEventListener('fullscreenchange',_fsUpdate);
document.addEventListener('fullscreenchange',function(){
  if(!document.fullscreenElement&&navigator.keyboard&&navigator.keyboard.unlock)navigator.keyboard.unlock();
});
document.addEventListener('keydown',function(e){
  if(e.key==='F11'){e.preventDefault();if(!document.fullscreenElement)_enterFS();}
  if(e.key==='Escape'){localStorage.removeItem('sfu_fs_locked');if(navigator.keyboard&&navigator.keyboard.unlock)navigator.keyboard.unlock();}
});

// ═══ IFRAME NAV ═══
(function(){
  if(window.parent===window) return;
  document.addEventListener('click',function(e){
    var a=e.target.closest('a[href]');
    if(!a||a.target) return;
    var h=a.getAttribute('href');
    if(!h||h==='#'||h.startsWith('javascript')) return;
    if(h.startsWith('/')){e.preventDefault();window.parent.postMessage({sfuNav:h},'*');}
  },true);
  document.addEventListener('keydown',function(e){
    if(e.key==='F11'){e.preventDefault();window.parent.postMessage({sfuF11:true},'*');}
    if(e.key==='Escape'){window.parent.postMessage({sfuEsc:true},'*');}
  },true);
})();
</script>
